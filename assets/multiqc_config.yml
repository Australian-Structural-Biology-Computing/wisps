report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/wisps/tree/dev" target="_blank">nf-core/wisps</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/wisps/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-wisps-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-wisps-summary":
    order: -1002

export_plots: true

disable_version_detection: true

strict: true

custom_data:
  colabfold_confidence:
    section_name: "ColabFold Confidence"
    description: "Confidence scores for models generated by ColabFold"
    file_format: "csv"
    plot_type: "table"
    pconfig:
      id: "colabfold_confidence_table"
      title: "ColabFold Confidence Scores"

  boltz_confidence:
    section_name: "Boltz Confidence"
    description: "Confidence scores for models generated by Boltz"
    file_format: "csv"
    plot_type: "table"
    pconfig:
      id: "boltz_confidence_table"
      title: "Boltz Confidence Scores"

  alphafold3_confidence:
    section_name: "AlphaFold3 Confidence"
    description: "Confidence scores for models generated by AlphaFold3"
    file_format: "csv"
    plot_type: "table"
    pconfig:
      id: "alphafold3_confidence_table"
      title: "AlphaFold3 Confidence Scores"

  ipsae_scores:
    section_name: "IPSAE scores"
    description: "Confidence scores for all used models generated by IPSAE"
    file_format: "csv"
    plot_type: "table"
    pconfig:
      id: "ipsae_scores_table"
      title: "IPSAE Confidence Scores"

sp:
  colabfold_confidence:
    fn: "*colabfold_confidence_scores_full.csv"
  boltz_confidence:
    fn: "*boltz_confidence_scores_full.csv"
  alphafold3_confidence:
    fn: "*alphafold3_confidence_scores_full.csv"
  ipsae_scores:
    fn: "*ipsae_scores.csv"

custom_table_header_config:
  ipsae_scores_table:
    colabfold_ipsae: { format: "{:,.5f}" }
    boltz_ipsae: { format: "{:,.5f}" }
    alphafold3_ipsae: { format: "{:,.5f}" }
